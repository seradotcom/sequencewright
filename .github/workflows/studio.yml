name: Studio behavior and visual evidence
on:
  push:
    paths: ['public/**', 'src/**', 'tests/**', 'vendor/**', 'scripts/**', 'package*.json', 'playwright.config.mjs', '.github/workflows/studio.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  behavior:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Check exact source and run bounded application tests
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          mkdir -p verification/unit
          npm run check
          node --test --test-reporter=tap tests/*.test.mjs > verification/unit/results.tap
      - name: Install pinned browser test tooling on the disposable runner
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Real browser behavior and screenshots
        run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: studio-${{ github.sha }}
          path: |
            verification/unit
            verification/browser
            playwright-report
            test-results
          retention-days: 14
